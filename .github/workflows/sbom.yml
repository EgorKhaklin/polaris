# ============================================================================
# SBOM per release (roadmap P0.5 / v9.167).
#
# On every published release, generate an SPDX 2.3 Software Bill of Materials
# for each shipped artifact and attach them to the release. A downstream
# operator can then answer "what is in this exact release" from a signed,
# versioned document instead of rebuilding and inspecting.
#
# Tooling: Trivy, the SAME version the image-cve-scan job in ci.yml already
# pins. One tool for the CVE gate and the SBOM keeps the bill of materials
# consistent with what the scanner actually saw; check_sbom_trivy_matches_scan
# fails CI if the two versions drift.
#
# Five artifacts: the Python runtime surface (requirements.txt) and the four
# self-built images (app, caddy, pgbouncer, postgres). Image SBOMs require the
# built image, so this rebuilds them at the release tag; that is release-cadence
# work, not per-push, so the cost is acceptable.
# ============================================================================

name: SBOM per release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)generate SBOMs for"
        required: true

permissions:
  contents: write   # upload assets to the release

env:
  # The one place the SBOM generator's Trivy version lives in THIS file. It
  # must equal the image-cve-scan pin in ci.yml (checked by polaris_checks).
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  sbom:
    name: Generate + attach SPDX SBOMs
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          [ -n "$TAG" ] || TAG="${{ github.event.inputs.tag }}"
          [ -n "$TAG" ] || { echo "::error::no release tag resolved"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout at the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Python runtime surface SBOM (SPDX)
        run: |
          mkdir -p sbom
          # Mount the source read-only and an output dir read-write; Trivy
          # writes the SPDX doc to the bind-mounted /out path.
          docker run --rm \
            -v "$PWD/polaris_web:/src:ro" \
            -v "$PWD/sbom:/out" \
            "$TRIVY_IMAGE" fs --format spdx-json \
            --output /out/sbom-python.spdx.json /src/requirements.txt
          test -s sbom/sbom-python.spdx.json || { echo "::error::python SBOM empty"; exit 1; }

      - name: Build the four self-built images
        run: |
          docker build -f polaris_web/Dockerfile.prod      -t polaris-app:sbom       .
          docker build -f polaris_web/Dockerfile.caddy     -t polaris-caddy:sbom     polaris_web
          docker build -f polaris_web/Dockerfile.pgbouncer -t polaris-pgbouncer:sbom polaris_web
          docker build -f polaris_web/Dockerfile.postgres  -t polaris-postgres:sbom  polaris_web

      - name: Image SBOMs (SPDX)
        run: |
          for name in app caddy pgbouncer postgres; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/sbom:/out" \
              "$TRIVY_IMAGE" image --format spdx-json \
              --output "/out/sbom-image-${name}.spdx.json" "polaris-${name}:sbom"
            test -s "sbom/sbom-image-${name}.spdx.json" \
              || { echo "::error::image SBOM for ${name} empty"; exit 1; }
          done

      - name: Validate every SBOM is SPDX 2.3
        run: |
          fail=0
          for f in sbom/*.spdx.json; do
            ver=$(python3 -c "import json,sys; print(json.load(open('$f')).get('spdxVersion',''))")
            n=$(python3 -c "import json,sys; d=json.load(open('$f')); print(len([p for p in d.get('packages',[]) if p.get('name')]))")
            echo "$f -> $ver, $n packages"
            [ "$ver" = "SPDX-2.3" ] || { echo "::error::$f is not SPDX-2.3"; fail=1; }
            [ "$n" -ge 1 ] || { echo "::error::$f lists no packages"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1

      - name: Attach SBOMs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" sbom/*.spdx.json --clobber
