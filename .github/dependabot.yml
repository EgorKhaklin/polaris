# Dependabot — automated dependency-update PRs for new security advisories.
#
# v9.105 (production-readiness, Wave 4). Pairs with the pip-audit `cve-scan`
# job in ci.yml: pip-audit GATES the build on a known CVE in the runtime
# surface; Dependabot proactively opens PRs to bump packages when a new
# advisory lands, so the fix is one review away rather than a manual sweep.
#
# MERGE POLICY (P0.3 / v9.161). Patch and minor bumps, GitHub Actions majors,
# and same-tag digest refreshes are batch-applied directly to main by the
# maintaining agent and validated by one full CI run; Dependabot then closes
# its PRs on its next scan. Majors of FOUNDATION dependencies are never
# auto-taken: they are deliberate roadmap work, and the `ignore` blocks below
# keep Dependabot from re-proposing them every week. Currently ignored:
#   - postgres major (the entire stack, CI, and docs pin PostgreSQL 16; a PG
#     major is a migration project, revisited in the P2 scale phase)
#   - python base-image major (runtime is pinned and tested on 3.12)
#   - plonky2 / plonky2_field major (the proving system itself; requires
#     proof-format compatibility study + two-witness revalidation, folded
#     into roadmap P0.7's ZK production profile)
# Removing an ignore block IS the decision record for taking that major.
version: 2
updates:
  # Python runtime + dev dependencies (both requirements files live here).
  - package-ecosystem: pip
    directory: /polaris_web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps

  # The Rust ZK crate.
  - package-ecosystem: cargo
    directory: /polaris_zk
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: "plonky2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "plonky2_field"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by the CI workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: ci

  # Docker base images + the prod compose's digest-pinned images (v9.114).
  # Tracks the FROM lines in the Dockerfiles and the digest-pinned image: refs
  # in docker-compose.prod.yml, opening PRs to bump a pinned digest when the
  # upstream tag moves (a frozen digest otherwise never gets security updates).
  - package-ecosystem: docker
    directory: /polaris_web
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: docker
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
