# Polaris pre-commit hooks
#
# A fast pre-push safety net. CI runs the full suite; these hooks catch the
# common regressions before they land.
#
# Install:
#     pip install pre-commit      # in the dev venv
#     pre-commit install          # one-time per clone
#
# Run manually:
#     pre-commit run --all-files
#
# Local hooks (no network); every entry is also runnable by hand from scripts/.
repos:
  - repo: local
    hooks:
      # The flat C1-C10 invariant layer. Exits non-zero on any FAIL.
      - id: polaris-checks
        name: polaris-checks (C1-C10 invariant layer)
        entry: python3 -m polaris_checks.run
        language: system
        pass_filenames: false
        always_run: true

      # Cross-reference integrity: every Markdown link + code path resolves.
      - id: polaris-link-check
        name: polaris-link-check (Markdown + cross-ref resolution)
        entry: bash scripts/polaris-link-check.sh --ci
        language: system
        pass_filenames: false
        always_run: true

      # Production compose must never carry a literal POLARIS_SECRET_KEY.
      - id: no-secret-in-prod-compose
        name: no sensitive env var literals in production compose
        entry: bash -c 'if grep -E "^\s*POLARIS_SECRET_KEY:\s*[\"a-zA-Z]" polaris_web/docker-compose.prod.yml 2>/dev/null; then echo "POLARIS_SECRET_KEY literal in prod compose"; exit 1; fi'
        language: system
        pass_filenames: false
        files: '^polaris_web/docker-compose\.prod\.yml$'

      # Project standard (docs/CONVENTIONS.md section 11): no em-dashes in
      # prose on any human-facing surface. Blocks only NEW em-dashes (via the
      # staged diff). Exempt: CHANGELOG.md and the verbatim records
      # (DEVNOTES/record.md, DEVNOTES/ships/, docs/operator/DR-DRILLS.md).
      - id: em-dash-block-new
        name: em-dash block on new lines (docs/CONVENTIONS.md section 11)
        entry: |
          bash -c '
            DIFF=$(git diff --cached --unified=0 -- "*.md" "docs/**" "DEVNOTES/**" "meta/**" "site/**" "deploy/**" "polaris_web/templates/**" NOTICE ":(exclude)CHANGELOG.md" ":(exclude)DEVNOTES/record.md" ":(exclude)DEVNOTES/ships/**" ":(exclude)docs/operator/DR-DRILLS.md" 2>/dev/null);
            if [ -z "$DIFF" ]; then exit 0; fi;
            VIOL=$(echo "$DIFF" | grep -E "^\+" | grep -v "^\+\+\+" | grep "—" || true);
            if [ -n "$VIOL" ]; then
              echo "Adding an em-dash to a human-facing document (docs/CONVENTIONS.md section 11 forbids):";
              echo "$VIOL" | head -5 | sed "s/^/  /";
              echo "Substitute with a colon, comma, parentheses, or a sentence break.";
              exit 1;
            fi;
          '
        language: system
        pass_filenames: false
        always_run: true
