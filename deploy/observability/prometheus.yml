# Polaris — Prometheus scrape + rules config (v9.115)
#
# A ready-to-use Prometheus config: scrape the app's /metrics and load the
# Polaris alerting rules. Point `static_configs.targets` at your deployment and
# wire `alerting` to your Alertmanager (the alerting backend is operator-provided
# — see deploy/observability/README.md). Validate with: promtool check config prometheus.yml
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - polaris-alerts.yml

# Operator-provided: point this at your Alertmanager and remove the comment.
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: polaris
    metrics_path: /metrics
    scheme: https
    static_configs:
      # Replace with your deployment's host:port (the app behind Caddy).
      - targets: ['polaris.example.com:443']
