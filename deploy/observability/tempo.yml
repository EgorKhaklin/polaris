# Polaris — Tempo trace-backend config (v9.187 / roadmap P1.6).
#
# The smallest useful Tempo: OTLP in (the app's exporter POSTs OTLP/HTTP to
# tempo:4318/v1/traces), local storage, bounded retention. Reference-scale by
# design — an authority running at state scale brings its own trace backend
# and points OTEL_EXPORTER_OTLP_ENDPOINT at it; every config here is standard
# OTel/Tempo, nothing Polaris-specific to migrate.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    # Traces are operational telemetry, not records: bounded retention is the
    # vocation posture (no long-lived request-linkage archive by default).
    block_retention: 168h   # 7 days
