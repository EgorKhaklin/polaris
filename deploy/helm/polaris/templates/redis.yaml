apiVersion: v1
kind: Service
metadata:
  name: {{ include "polaris.fullname" . }}-redis
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  clusterIP: None
  selector:
    {{- include "polaris.selector" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "polaris.fullname" . }}-redis
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "polaris.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "polaris.selector" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "polaris.selector" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      # No API token (see app.yaml); the projected token mount would collide
      # with the Secret mounts under /run/secrets.
      automountServiceAccountToken: false
      securityContext:
        {{- include "polaris.podSecurity" (dict "uid" 999 "gid" 1000) | nindent 8 }}
      containers:
        - name: redis
          image: {{ .Values.images.redis }}
          imagePullPolicy: {{ .Values.images.redisPullPolicy }}
          securityContext:
            {{- include "polaris.containerSecurity" . | nindent 12 }}
          args: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 320Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.redis }}
