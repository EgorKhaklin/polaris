# kind cluster for the Polaris Helm drill (roadmap P1.5). The default CNI
# (kindnet) does NOT enforce NetworkPolicy, so it is disabled and Calico is
# installed by scripts/polaris-helm-drill.sh; the pod subnet is Calico's default.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
