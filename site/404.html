<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found: Polaris</title>
<meta name="description" content="That page does not exist on the Polaris project site.">
<meta name="theme-color" content="#050a12">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{--void:#050a12;--line:rgba(141,166,196,.16);--ink:#dce9f6;--dim:#9db1c7;--faint:#6e8299;
    --gold:#c9a352;--gold-b:#e8be64;--cyan:#5dd6ff;
    --mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Monaco,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100vh;background:
    radial-gradient(ellipse 120% 700px at 50% -90px, rgba(93,214,255,.05) 0%, transparent 55%),
    linear-gradient(180deg,#081120 0%,var(--void) 420px) var(--void);
    color:var(--ink);display:flex;align-items:center;justify-content:center;
    font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
main{text-align:center;padding:40px 22px;max-width:620px}
.code{font-family:var(--mono);font-size:64px;font-weight:700;letter-spacing:.18em;color:var(--gold-b);
    text-shadow:0 0 36px rgba(232,190,100,.3);margin:0 0 10px}
h1{font-size:18px;font-weight:650;letter-spacing:.04em;margin:0 0 14px;color:var(--ink)}
p{color:var(--dim);margin:0 0 26px}
a.btn{display:inline-block;padding:12px 26px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;border:1px solid rgba(93,214,255,.35);border-radius:3px;color:var(--cyan);
    text-decoration:none}
a.btn:hover{background:rgba(93,214,255,.1);border-color:var(--cyan)}
.foot{margin-top:34px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--faint)}
.foot a{color:var(--faint)}
</style>
</head>
<body>
<main>
    <p class="code">404</p>
    <h1>That page is not here</h1>
    <p>The Polaris project site is a single page. The link that brought you here is
        either out of date or was never ours.</p>
    <a class="btn" href="/polaris-id/">Back to the project site</a>
    <p class="foot"><a href="https://github.com/EgorKhaklin/polaris-id">github.com/EgorKhaklin/polaris-id</a></p>
</main>
</body>
</html>
