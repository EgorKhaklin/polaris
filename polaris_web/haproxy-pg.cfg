# polaris_web/haproxy-pg.cfg — the database entry points of the HA profile
# (v9.243, roadmap P2.7).
#
# HAProxy forwards TCP untouched (the TLS between the pooler and Postgres
# passes through) and decides WHERE by asking Patroni's REST API on each node:
# /primary answers 200 only on the node that holds the leader lease, /replica
# only on a streaming replica. A node that loses the lease answers 503 within
# one check interval and HAProxy closes the sessions to it
# (on-marked-down shutdown-sessions), so the pooler's next connect lands on the
# new leader and never on a demoted node. Names resolve through Docker's DNS
# at runtime (resolvers), so a recreated node with a new address is followed.

global
    log stdout format raw local0 info
    maxconn 1000

defaults
    mode tcp
    log global
    option tcplog
    # A backend connect that fails is retried on ANOTHER server (redispatch)
    # rather than the one that just went down; a connect not complete in 3 s is
    # abandoned. Checks every half second, two misses to mark down: a demoted
    # leader is out of rotation within about a second.
    retries 3
    option redispatch
    timeout connect 3s
    timeout client 1h
    timeout server 1h
    default-server inter 500ms fall 2 rise 2 on-marked-down shutdown-sessions

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold nx 1s
    hold refused 1s
    hold timeout 1s
    hold other 1s

# Writes: the one node holding the leader lease.
listen primary
    bind *:5432
    option httpchk GET /primary
    http-check expect status 200
    server postgres  postgres:5432  check port 8008 resolvers docker init-addr libc,none
    server postgres2 postgres2:5432 check port 8008 resolvers docker init-addr libc,none

# Reads: any streaming replica (roadmap P2.2 routes the read-only surfaces here).
listen replicas
    bind *:5433
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    server postgres  postgres:5432  check port 8008 resolvers docker init-addr libc,none
    server postgres2 postgres2:5432 check port 8008 resolvers docker init-addr libc,none
