; ============================================================================
; pgbouncer.ini — Polaris production connection pooler
;
; v8.83 / Arc B Phase 2 — multi-instance scaling foundations.
; Inserted between the Polaris app and Postgres to absorb connection
; volume beyond what a single Postgres backend can sustain.
;
; Polaris's per-request connection model (psycopg2.connect() per
; request, closed at the end) is the simplest correct pattern but
; saturates Postgres's max_connections ceiling above ~30-50 concurrent
; operators. pgbouncer in transaction-pooling mode multiplexes thousands
; of short-lived app connections onto a handful of long-lived
; backend connections.
;
; Threat-model note: pgbouncer is on the trusted side of the
; production-stack network boundary (only reachable from inside the
; polaris-net Docker network). The userlist is file-mounted from
; ./pgbouncer-userlist.txt (G28-style; gitignored).
; ============================================================================

[databases]
; Route everything to the named "polaris" database on the postgres
; service. The app connects to pgbouncer:6432 ; pgbouncer forwards
; to postgres:5432.
polaris = host=postgres port=5432 dbname=polaris

[pgbouncer]
; ---- Network ----
listen_addr        = 0.0.0.0
listen_port        = 6432

; ---- Authentication ----
; The userlist file maps username -> hashed password. Polaris's
; polaris_app role is the only one defined; postgres superuser is NOT
; exposed through pgbouncer (administrative work goes directly to
; postgres via docker compose exec).
auth_type          = scram-sha-256
auth_file          = /etc/pgbouncer/userlist.txt

; ---- Pooling ----
; transaction mode: a backend connection is held only for the duration
; of a transaction. This is the right mode for Polaris's per-request
; pattern (each /api/* call is one transaction) and gives the highest
; multiplexing factor. Session-pinned features (prepared statements
; cached client-side, LISTEN/NOTIFY) are not used by Polaris.
pool_mode          = transaction
default_pool_size  = 20
min_pool_size      = 5
reserve_pool_size  = 5
reserve_pool_timeout = 3.0
max_client_conn    = 500
max_db_connections = 50

; Server-side connection lifecycle
server_idle_timeout    = 600
server_lifetime        = 3600
server_connect_timeout = 15
server_login_retry     = 5

; Client-side
client_idle_timeout    = 0
client_login_timeout   = 60

; ---- TLS to backend (in-network plaintext for Polaris; backend is
;      colocated and isolated by Docker network) ----
server_tls_sslmode = disable

; ---- Logging ----
; Verbose enough for incident response; not so verbose that the log
; volume itself is an operational risk.
log_connections    = 1
log_disconnections = 0
log_pooler_errors  = 1
log_stats          = 1
stats_period       = 60
verbose            = 0

; ---- Admin ----
; The admin pseudo-database (used for SHOW POOLS / SHOW CLIENTS /
; RECONNECT / KILL etc.) is reachable only from within the container.
; Polaris's app never speaks pgbouncer-admin; operator does this via
; `docker compose -f docker-compose.prod.yml exec pgbouncer psql -p
; 6432 -U polaris_app pgbouncer`.
admin_users        = polaris_app
stats_users        = polaris_app

; ---- Limits ----
pkt_buf            = 4096
listen_backlog     = 128
sbuf_loopcnt       = 5

; ---- Application name visibility ----
application_name_add_host = 1

; ---- Health check (the app probes via /api/health which goes through
;      this pool; an extra TCP-level health check would also work but
;      is unnecessary in the standard deployment) ----
ignore_startup_parameters = extra_float_digits
