# ============================================================================
# Polaris — Production Docker Compose (Arc B Phase 1, v8.77)
#
# Stack: Caddy (TLS) + app (gunicorn) + Postgres 16 + Redis 7
#
# G27: TLS is required — Caddy provisions Let's Encrypt cert for POLARIS_DOMAIN
# G28: Sensitive secrets are FILE-MOUNTED at /run/secrets/*, never `environment:`
# G29: app exposes structured /api/health JSON (per-component checks)
#
# Bring up:
#     export POLARIS_DOMAIN=polaris.example.com
#     ../scripts/polaris-generate-secrets.sh   # one-time
#     docker compose -f docker-compose.prod.yml up -d
#
# Smoke:
#     curl -fsS https://${POLARIS_DOMAIN}/api/health | jq .
# ============================================================================

services:

  caddy:
    # Self-built (v9.135): the Caddyfile uses the third-party `rate_limit`
    # directive, which is NOT in the stock caddy image, so the stock image
    # crash-looped on the unrecognized directive. Dockerfile.caddy compiles the
    # caddy-ratelimit plugin in (FROM stages digest-pinned; Dependabot tracks
    # them). Same posture as the self-built pgbouncer.
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: polaris-caddy:prod
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    container_name: polaris-caddy
    restart: unless-stopped
    # v9.141 — container hardening (CIS Docker 5.x): drop every Linux capability,
    # keep only NET_BIND_SERVICE so the public edge can bind :80/:443, and forbid
    # privilege escalation. (Process-count caps live in deploy.resources.)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"          # HTTP/3
    environment:
      POLARIS_DOMAIN: ${POLARIS_DOMAIN:?POLARIS_DOMAIN must be set in shell env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs:/var/log/caddy
    depends_on:
      app:
        condition: service_healthy
    networks:
      - polaris-net

  app:
    image: polaris-app:prod
    # Resource limits (one bad container must not OOM the host) + log rotation
    # (json-file capped at max-size x max-file, so logs cannot fill the disk).
    # Compose v2 honors deploy.resources.limits for `docker compose up`.
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 768M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    build:
      # Repo root: the zk-builder stage COPYs polaris_zk/ (a sibling of
      # polaris_web/) and Docker COPY cannot escape the build context. All
      # app-file COPYs in Dockerfile.prod are repo-root-relative to match.
      context: ..
      dockerfile: polaris_web/Dockerfile.prod
    container_name: polaris-app
    restart: unless-stopped
    # v9.141 — container hardening. The app already runs non-root (USER polaris,
    # uid 1000) and binds :8000 (>1024), so it needs no capabilities at all.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Non-sensitive runtime config (G28: nothing here is sensitive)
      # v8.83: app talks to pgbouncer:6432, which multiplexes onto
      # postgres:5432. Connection-pooling foundations for Arc B Phase 2.
      POLARIS_DB_HOST: pgbouncer
      POLARIS_DB_PORT: '6432'
      POLARIS_DB_NAME: polaris
      POLARIS_DB_USER: polaris_app
      POLARIS_DB_PASSWORD_FILE: /run/secrets/polaris_db_password
      # v9.121/v9.131 — encrypt + VERIFY the app<->pgbouncer hop. pgbouncer
      # presents its STABLE self-signed cert; the app pins it via verify-ca +
      # POLARIS_DB_SSLROOTCERT, so a MITM presenting a different cert is rejected
      # (no real CA needed). 'verify-full' + hostname stays the operator's upgrade.
      POLARIS_DB_SSLMODE: verify-ca
      POLARIS_DB_SSLROOTCERT: /etc/polaris-pgb-certs/pgbouncer.crt
      POLARIS_SECRET_KEY_FILE: /run/secrets/polaris_secret_key
      POLARIS_REDIS_HOST: redis
      POLARIS_REDIS_PORT: '6379'
      # security.py's rate-limiter auto-selector keys on POLARIS_REDIS_URL, not
      # HOST/PORT. Without it the limiter silently falls back to per-worker
      # in-memory buckets — and prod runs 4 gunicorn workers, so per-IP limits
      # fragment 4x (a real brute-force weakening). Point it at the redis service
      # so the atomic cross-worker Redis limiter is actually used.
      POLARIS_REDIS_URL: redis://redis:6379/0
      POLARIS_PORT: '8000'
      POLARIS_STATE_DIR: /var/lib/polaris/state
      POLARIS_ENV: production
      # v9.120: gunicorn runs multiple workers, so Prometheus metrics use
      # multiprocess mode — each worker file-backs its samples here and /metrics
      # aggregates them (else a scrape reports only one worker's counts).
      # gunicorn.conf.py clears this dir at master start.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
      POLARIS_ZK_BINARY: /opt/polaris/zk
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      # v9.116: real ML-DSA-65 signing is the production default (liboqs ships in
      # the prod image). The signing keypair is the file-mounted secret below; its
      # public key is the stable trust anchor verify_token_signature checks
      # against. Operators custodying key material in an HSM/KMS replace the
      # generated secret with their loader (that custody is operator-gated).
      POLARIS_USE_REAL_PQC: '1'
      POLARIS_PQC_SIGNING_KEY_FILE: /run/secrets/polaris_signing_key
    secrets:
      - polaris_secret_key
      - polaris_db_password
      - polaris_signing_key
    volumes:
      - polaris_state:/var/lib/polaris/state
      - ./logs:/var/log/polaris
      # v9.131 — pgbouncer's public cert, pinned as the app's sslrootcert (verify-ca).
      - ./secrets/pgbouncer_server.crt:/etc/polaris-pgb-certs/pgbouncer.crt:ro
      - ../sanctum:/opt/polaris/sanctum:ro
      - ../journal:/opt/polaris/journal:ro
    networks:
      - polaris-net
    # No `ports:` block here — app is only reachable via Caddy

  # ----------------------------------------------------------------------
  # pgbouncer — Arc B Phase 2 connection pooler (v8.83; self-built v9.110)
  #
  # Multiplexes thousands of short-lived app connections onto a handful
  # of long-lived Postgres backends. Transaction-pooling mode (one
  # backend per transaction); compatible with Polaris's per-request
  # connection pattern.
  #
  # v9.110: built from polaris_web/Dockerfile.pgbouncer (alpine + the distro
  # pgbouncer package) instead of bitnami/pgbouncer:1.22, which Bitnami removed
  # from Docker Hub when they retired their free catalogue. The entrypoint reads
  # the DB password from the file-mounted secret and runs SCRAM on both hops.
  #
  # See `docs/operator/OPERATIONS.md` § Scaling for tuning notes.
  # ----------------------------------------------------------------------
  pgbouncer:
    build:
      # Context is polaris_web/ (this compose file's directory): the pgbouncer
      # image only needs Dockerfile.pgbouncer + pgbouncer-entrypoint.sh.
      context: .
      dockerfile: Dockerfile.pgbouncer
    image: polaris-pgbouncer:prod
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    container_name: polaris-pgbouncer
    restart: unless-stopped
    # v9.141 — container hardening. pgbouncer runs non-root (USER pgbouncer) and
    # binds :6432 (>1024); no capabilities needed.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Consumed by pgbouncer-entrypoint.sh to generate pgbouncer.ini +
      # userlist.txt at start. The password is NOT here — it is read from the
      # file-mounted secret below (POLARIS_DB_PASSWORD_FILE).
      POLARIS_DB_HOST: postgres
      POLARIS_DB_PORT: '5432'
      POLARIS_DB_NAME: polaris
      POLARIS_DB_USER: polaris_app
      POLARIS_DB_PASSWORD_FILE: /run/secrets/polaris_db_password
      PGBOUNCER_LISTEN_PORT: '6432'
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_DEFAULT_POOL_SIZE: '20'
      PGBOUNCER_MIN_POOL_SIZE: '5'
      PGBOUNCER_RESERVE_POOL_SIZE: '5'
      PGBOUNCER_MAX_CLIENT_CONN: '500'
      PGBOUNCER_MAX_DB_CONNECTIONS: '50'
      # v9.121/v9.131 — TLS + VERIFICATION on both hops. server_tls verify-ca
      # pins postgres's self-signed cert (server_tls_ca_file); client_tls presents
      # pgbouncer's STABLE self-signed cert (mounted, so the app can pin it) and
      # requires clients to use TLS. Both hops reject a MITM with a different cert.
      PGBOUNCER_SERVER_TLS_SSLMODE: verify-ca
      PGBOUNCER_SERVER_TLS_CA_FILE: /etc/polaris-pg-certs/postgres.crt
      PGBOUNCER_CLIENT_TLS_SSLMODE: require
      PGBOUNCER_CLIENT_TLS_CERT_FILE: /etc/polaris-pgb-certs/pgbouncer.crt
      PGBOUNCER_CLIENT_TLS_KEY_FILE: /etc/polaris-pgb-certs/pgbouncer.key
    secrets:
      - polaris_db_password
    volumes:
      # v9.131 — the certs pgbouncer needs: postgres's cert (to VERIFY the backend
      # hop, server_tls verify-ca) and its own cert+key (to present to the app,
      # client_tls). The key is 0644 inside the 0700 host secrets dir so the
      # non-root pgbouncer user can read it across the bind mount (the dir gates
      # host access; see polaris-generate-secrets.sh).
      - ./secrets/postgres_server.crt:/etc/polaris-pg-certs/postgres.crt:ro
      - ./secrets/pgbouncer_server.crt:/etc/polaris-pgb-certs/pgbouncer.crt:ro
      - ./secrets/pgbouncer_server.key:/etc/polaris-pgb-certs/pgbouncer.key:ro
    healthcheck:
      # Cheap TCP liveness on the listen port (netcat is in the image).
      test: ["CMD", "nc", "-z", "127.0.0.1", "6432"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - polaris-net
    # No `ports:` block — pgbouncer is reachable only from inside the
    # polaris-net network. App connects to pgbouncer:6432.

  postgres:
    # v9.126+ — built from postgres:16-alpine + pgBackRest (Dockerfile.postgres)
    # so the primary's archive_command can push WAL. The base FROM is digest-
    # pinned in the Dockerfile. The local tag keeps the digest-pin check's
    # 'polaris-' carve-out (it is built here, not pulled).
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: polaris-postgres:prod
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    container_name: polaris-postgres
    restart: unless-stopped
    # v9.141 — container hardening. The postgres image starts as root, fixes the
    # data-dir ownership, then drops to the postgres user via gosu. Drop all caps
    # but keep the ones that init + the privilege drop need: CHOWN/DAC_OVERRIDE/
    # FOWNER (data-dir perms) and SETUID/SETGID (gosu's drop to the postgres user).
    # The server process itself runs unprivileged as postgres.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/polaris_db_root_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # Signals docker-init.sh to neutralize the demo accounts (admin/Admin@123!
      # etc.) the SQL seed loads — fine for dev, catastrophic in production.
      POLARIS_ENV: production
      # docker-init.sh rotates the polaris_app role password to THIS secret —
      # the same /run/secrets/polaris_db_password the app and pgbouncer
      # authenticate with — so the role and its clients never diverge. Without
      # this, polaris_app keeps the dev default from 09_grants.sql and prod auth
      # fails. The secret is already mounted below.
      POLARIS_APP_PASSWORD_FILE: /run/secrets/polaris_db_password
      # v9.126 — streaming-replication readiness. docker-init.sh reads this to
      # create the polaris_replicator role + the pg_hba entry so a standby can
      # clone with pg_basebackup. The standby HOST is operator-supplied (see
      # docs/operator/FAILOVER.md); POLARIS_REPLICATION_CIDR (default 'samenet')
      # scopes pg_hba for a remote standby.
      POLARIS_REPLICATOR_PASSWORD_FILE: /run/secrets/polaris_replicator_password
      # v9.126+ — continuous WAL archiving (pgBackRest). OFF by default so a
      # deployment without a provisioned repo does not accumulate WAL. Set to '1'
      # AFTER pointing pgbackrest.conf at an offsite repo (S3) and running
      # `pgbackrest --stanza=polaris stanza-create`. docker-init.sh then enables
      # archive_mode + the archive_command. See docs/operator/DR.md.
      POLARIS_PGBACKREST_ENABLED: "${POLARIS_PGBACKREST_ENABLED:-0}"
    secrets:
      - polaris_db_password
      - polaris_db_root_password
      - polaris_replicator_password
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../polaris_sql:/docker-entrypoint-initdb.d/sql:ro
      - ./docker-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      # v9.121 — TLS server cert (from polaris-generate-secrets.sh). docker-init
      # copies it into the data dir and turns ssl on so the app<->DB hop is encrypted.
      - ./secrets/postgres_server.crt:/etc/polaris-pg-certs/server.crt:ro
      - ./secrets/postgres_server.key:/etc/polaris-pg-certs/server.key:ro
      # v9.126+ — the pgBackRest stanza config + the local repo volume (operator
      # swaps repo1 for S3; see pgbackrest.conf).
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - pgbackrest_repo:/var/lib/pgbackrest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polaris"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - polaris-net

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    container_name: polaris-redis
    restart: unless-stopped
    # v9.141 — container hardening. Like postgres, the redis image starts as root,
    # chowns /data, then drops to the redis user via setpriv — so it needs the
    # same minimal caps for that drop (CHOWN/DAC_OVERRIDE/FOWNER for /data,
    # SETGID/SETUID for setpriv). The redis server then runs unprivileged.
    # Internal-network-only (no published ports).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - polaris-net

# ----------------------------------------------------------------------------
# Secrets — file-mounted from ./secrets/ on the host (G28)
#
# Generation: ../scripts/polaris-generate-secrets.sh
# Rotation:   ../scripts/polaris-rotate-secret.sh <name>
# ----------------------------------------------------------------------------
secrets:
  polaris_secret_key:
    file: ./secrets/polaris_secret_key
  polaris_db_password:
    file: ./secrets/polaris_db_password
  polaris_db_root_password:
    file: ./secrets/polaris_db_root_password
  polaris_replicator_password:
    file: ./secrets/polaris_replicator_password
  # ML-DSA-65 signing keypair (JSON: algorithm + secret_key_hex + public_key_hex),
  # minted by polaris-generate-secrets.sh. The public key is the trust anchor.
  polaris_signing_key:
    file: ./secrets/polaris_signing_key

# ----------------------------------------------------------------------------
# Volumes (named; survive `down`, destroyed by `down -v`)
# ----------------------------------------------------------------------------
volumes:
  pgbackrest_repo:
    driver: local
  pg_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  polaris_state:
    driver: local

# ----------------------------------------------------------------------------
# Network (internal; only Caddy exposes ports to the host)
# ----------------------------------------------------------------------------
networks:
  polaris-net:
    driver: bridge
