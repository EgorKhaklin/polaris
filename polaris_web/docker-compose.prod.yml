# ============================================================================
# Polaris — Production Docker Compose (Arc B Phase 1, v8.77)
#
# Stack: Caddy (TLS) + app (gunicorn) + Postgres 16 + Redis 7
#
# G27: TLS is required — Caddy provisions Let's Encrypt cert for POLARIS_DOMAIN
# G28: Sensitive secrets are FILE-MOUNTED at /run/secrets/*, never `environment:`
# G29: app exposes structured /api/health JSON (per-component checks)
#
# Bring up:
#     export POLARIS_DOMAIN=polaris.example.com
#     ../scripts/polaris-generate-secrets.sh   # one-time
#     docker compose -f docker-compose.prod.yml up -d
#
# Smoke:
#     curl -fsS https://${POLARIS_DOMAIN}/api/health | jq .
# ============================================================================

services:

  caddy:
    # Digest-pinned (v9.114): the tag stays for readability, the @sha256 makes
    # the image immutable so a mutated/retagged upstream cannot change what runs.
    # Dependabot (docker ecosystem) opens PRs to bump the digest.
    image: caddy:2-alpine@sha256:77c07d5ebfa5be9fd6c820d2094ae662c9e7eeb9bf98346b7f639900263ee2a2
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    container_name: polaris-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"          # HTTP/3
    environment:
      POLARIS_DOMAIN: ${POLARIS_DOMAIN:?POLARIS_DOMAIN must be set in shell env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs:/var/log/caddy
    depends_on:
      app:
        condition: service_healthy
    networks:
      - polaris-net

  app:
    image: polaris-app:prod
    # Resource limits (one bad container must not OOM the host) + log rotation
    # (json-file capped at max-size x max-file, so logs cannot fill the disk).
    # Compose v2 honors deploy.resources.limits for `docker compose up`.
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 768M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    build:
      # Repo root: the zk-builder stage COPYs polaris_zk/ (a sibling of
      # polaris_web/) and Docker COPY cannot escape the build context. All
      # app-file COPYs in Dockerfile.prod are repo-root-relative to match.
      context: ..
      dockerfile: polaris_web/Dockerfile.prod
    container_name: polaris-app
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Non-sensitive runtime config (G28: nothing here is sensitive)
      # v8.83: app talks to pgbouncer:6432, which multiplexes onto
      # postgres:5432. Connection-pooling foundations for Arc B Phase 2.
      POLARIS_DB_HOST: pgbouncer
      POLARIS_DB_PORT: '6432'
      POLARIS_DB_NAME: polaris
      POLARIS_DB_USER: polaris_app
      POLARIS_DB_PASSWORD_FILE: /run/secrets/polaris_db_password
      # v9.121 — encrypt the app<->pgbouncer hop. pgbouncer presents a self-signed
      # cert (client_tls below), so 'require' encrypts without cert verification;
      # an operator with a CA can raise this to 'verify-full'.
      POLARIS_DB_SSLMODE: require
      POLARIS_SECRET_KEY_FILE: /run/secrets/polaris_secret_key
      POLARIS_REDIS_HOST: redis
      POLARIS_REDIS_PORT: '6379'
      # security.py's rate-limiter auto-selector keys on POLARIS_REDIS_URL, not
      # HOST/PORT. Without it the limiter silently falls back to per-worker
      # in-memory buckets — and prod runs 4 gunicorn workers, so per-IP limits
      # fragment 4x (a real brute-force weakening). Point it at the redis service
      # so the atomic cross-worker Redis limiter is actually used.
      POLARIS_REDIS_URL: redis://redis:6379/0
      POLARIS_PORT: '8000'
      POLARIS_STATE_DIR: /var/lib/polaris/state
      POLARIS_ENV: production
      # v9.120: gunicorn runs multiple workers, so Prometheus metrics use
      # multiprocess mode — each worker file-backs its samples here and /metrics
      # aggregates them (else a scrape reports only one worker's counts).
      # gunicorn.conf.py clears this dir at master start.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
      POLARIS_ZK_BINARY: /opt/polaris/zk
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      # v9.116: real ML-DSA-65 signing is the production default (liboqs ships in
      # the prod image). The signing keypair is the file-mounted secret below; its
      # public key is the stable trust anchor verify_token_signature checks
      # against. Operators custodying key material in an HSM/KMS replace the
      # generated secret with their loader (that custody is operator-gated).
      POLARIS_USE_REAL_PQC: '1'
      POLARIS_PQC_SIGNING_KEY_FILE: /run/secrets/polaris_signing_key
    secrets:
      - polaris_secret_key
      - polaris_db_password
      - polaris_signing_key
    volumes:
      - polaris_state:/var/lib/polaris/state
      - ./logs:/var/log/polaris
      - ../sanctum:/opt/polaris/sanctum:ro
      - ../journal:/opt/polaris/journal:ro
    networks:
      - polaris-net
    # No `ports:` block here — app is only reachable via Caddy

  # ----------------------------------------------------------------------
  # pgbouncer — Arc B Phase 2 connection pooler (v8.83; self-built v9.110)
  #
  # Multiplexes thousands of short-lived app connections onto a handful
  # of long-lived Postgres backends. Transaction-pooling mode (one
  # backend per transaction); compatible with Polaris's per-request
  # connection pattern.
  #
  # v9.110: built from polaris_web/Dockerfile.pgbouncer (alpine + the distro
  # pgbouncer package) instead of bitnami/pgbouncer:1.22, which Bitnami removed
  # from Docker Hub when they retired their free catalogue. The entrypoint reads
  # the DB password from the file-mounted secret and runs SCRAM on both hops.
  #
  # See `docs/operator/OPERATIONS.md` § Scaling for tuning notes.
  # ----------------------------------------------------------------------
  pgbouncer:
    build:
      # Context is polaris_web/ (this compose file's directory): the pgbouncer
      # image only needs Dockerfile.pgbouncer + pgbouncer-entrypoint.sh.
      context: .
      dockerfile: Dockerfile.pgbouncer
    image: polaris-pgbouncer:prod
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    container_name: polaris-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Consumed by pgbouncer-entrypoint.sh to generate pgbouncer.ini +
      # userlist.txt at start. The password is NOT here — it is read from the
      # file-mounted secret below (POLARIS_DB_PASSWORD_FILE).
      POLARIS_DB_HOST: postgres
      POLARIS_DB_PORT: '5432'
      POLARIS_DB_NAME: polaris
      POLARIS_DB_USER: polaris_app
      POLARIS_DB_PASSWORD_FILE: /run/secrets/polaris_db_password
      PGBOUNCER_LISTEN_PORT: '6432'
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_DEFAULT_POOL_SIZE: '20'
      PGBOUNCER_MIN_POOL_SIZE: '5'
      PGBOUNCER_RESERVE_POOL_SIZE: '5'
      PGBOUNCER_MAX_CLIENT_CONN: '500'
      PGBOUNCER_MAX_DB_CONNECTIONS: '50'
      # v9.121 — TLS on both hops: encrypt pgbouncer -> postgres (server_tls) and
      # app -> pgbouncer (client_tls; the entrypoint mints a self-signed cert).
      PGBOUNCER_SERVER_TLS_SSLMODE: require
      PGBOUNCER_CLIENT_TLS_SSLMODE: require
    secrets:
      - polaris_db_password
    healthcheck:
      # Cheap TCP liveness on the listen port (netcat is in the image).
      test: ["CMD", "nc", "-z", "127.0.0.1", "6432"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - polaris-net
    # No `ports:` block — pgbouncer is reachable only from inside the
    # polaris-net network. App connects to pgbouncer:6432.

  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    container_name: polaris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/polaris_db_root_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # Signals docker-init.sh to neutralize the demo accounts (admin/Admin@123!
      # etc.) the SQL seed loads — fine for dev, catastrophic in production.
      POLARIS_ENV: production
      # docker-init.sh rotates the polaris_app role password to THIS secret —
      # the same /run/secrets/polaris_db_password the app and pgbouncer
      # authenticate with — so the role and its clients never diverge. Without
      # this, polaris_app keeps the dev default from 09_grants.sql and prod auth
      # fails. The secret is already mounted below.
      POLARIS_APP_PASSWORD_FILE: /run/secrets/polaris_db_password
    secrets:
      - polaris_db_password
      - polaris_db_root_password
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../polaris_sql:/docker-entrypoint-initdb.d/sql:ro
      - ./docker-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      # v9.121 — TLS server cert (from polaris-generate-secrets.sh). docker-init
      # copies it into the data dir and turns ssl on so the app<->DB hop is encrypted.
      - ./secrets/postgres_server.crt:/etc/polaris-pg-certs/server.crt:ro
      - ./secrets/postgres_server.key:/etc/polaris-pg-certs/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polaris"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - polaris-net

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    container_name: polaris-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - polaris-net

# ----------------------------------------------------------------------------
# Secrets — file-mounted from ./secrets/ on the host (G28)
#
# Generation: ../scripts/polaris-generate-secrets.sh
# Rotation:   ../scripts/polaris-rotate-secret.sh <name>
# ----------------------------------------------------------------------------
secrets:
  polaris_secret_key:
    file: ./secrets/polaris_secret_key
  polaris_db_password:
    file: ./secrets/polaris_db_password
  polaris_db_root_password:
    file: ./secrets/polaris_db_root_password
  # ML-DSA-65 signing keypair (JSON: algorithm + secret_key_hex + public_key_hex),
  # minted by polaris-generate-secrets.sh. The public key is the trust anchor.
  polaris_signing_key:
    file: ./secrets/polaris_signing_key

# ----------------------------------------------------------------------------
# Volumes (named; survive `down`, destroyed by `down -v`)
# ----------------------------------------------------------------------------
volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  polaris_state:
    driver: local

# ----------------------------------------------------------------------------
# Network (internal; only Caddy exposes ports to the host)
# ----------------------------------------------------------------------------
networks:
  polaris-net:
    driver: bridge
