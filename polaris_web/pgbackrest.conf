# ============================================================================
# pgbackrest.conf — Polaris continuous-WAL-archiving stanza
#
# v9.126+ (production-readiness, Wave 3). Mounted into the postgres container at
# /etc/pgbackrest/pgbackrest.conf. The primary's archive_command pushes WAL here
# (enabled by docker-init.sh when POLARIS_PGBACKREST_ENABLED is set); the
# operator runs `pgbackrest --stanza=polaris stanza-create` once, then `backup`
# on a schedule. See docs/operator/DR.md.
#
# DEFAULT: a LOCAL filesystem repo (repo1-path). This is what the CI round-trip
# exercises and is fine for a drill, but a local repo on the database host is NOT
# offsite — it does not survive the host. For real durability, the operator
# points the repo at an offsite S3 bucket by replacing the repo1-path block with
# their bucket (the credentials are operator-supplied and must NOT be committed):
#
#   repo1-type=s3
#   repo1-s3-bucket=<bucket>
#   repo1-s3-endpoint=<endpoint>
#   repo1-s3-region=<region>
#   repo1-s3-key=<access-key>            # supply via env/secret, not this file
#   repo1-s3-key-secret=<secret-key>     # supply via env/secret, not this file
#   repo1-path=/polaris
#
# pgBackRest reads repo1-s3-key / repo1-s3-key-secret from the environment when
# omitted here (PGBACKREST_REPO1_S3_KEY / _SECRET), so the keys stay out of the
# config file and the image.
# ============================================================================

[global]
# Local filesystem repo by default (operator swaps to S3 for offsite durability).
repo1-path=/var/lib/pgbackrest
# Keep two full backups + their differentials/WAL; older are expired on backup.
repo1-retention-full=2
# Checksums on the repo so silent corruption is caught.
repo1-bundle=y
# A non-blocking checkpoint at backup start (lower impact on a busy primary).
start-fast=y
# Compress WAL + backups in the repo.
compress-type=zst
# Surface real errors; archive-push retries are postgres's job.
log-level-console=info
log-level-file=detail

[polaris]
pg1-path=/var/lib/postgresql/data
